<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Бизнес Симулятор</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: var(--tg-theme-bg-color, #ffffff);
            --text-color: var(--tg-theme-text-color, #000000);
            --hint-color: var(--tg-theme-hint-color, #999999);
            --button-color: var(--tg-theme-button-color, #2481cc);
            --button-text-color: var(--tg-theme-button-text-color, #ffffff);
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h2 { margin: 12px 0 6px 0; font-size: 16px; width: 100%; max-width: 400px; text-align: left; }
        .card {
            background: rgba(128, 128, 128, 0.1);
            border-radius: 12px;
            padding: 12px;
            width: 100%;
            max-width: 400px;
            margin-bottom: 8px;
            box-sizing: border-box;
            font-size: 14px;
            line-height: 1.4;
        }
        .btn-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            width: 100%;
            max-width: 400px;
        }
        .full-width {
            grid-column: span 2;
        }
        button {
            background-color: var(--button-color);
            color: var(--button-text-color);
            border: none;
            border-radius: 8px;
            padding: 10px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        button:active { opacity: 0.8; }
    </style>
</head>
<body>

    <div class="card" id="user-card">
        👤 Загрузка профиля...
    </div>

    <h2>🏢 Выберите тип бизнеса</h2>
    <div class="btn-grid">
        <button onclick="sendAction('select:Кафе')">☕ Кафе</button>
        <button onclick="sendAction('select:Магазин одежды')">👗 Одежда</button>
        <button onclick="sendAction('select:Интернет магазин')">🎧 Интернет-маг</button>
        <button onclick="sendAction('select:Автомойка')">🚗 Автомойка</button>
    </div>

    <h2>⚙️ Действия и Торговля</h2>
    <div class="btn-grid">
        <button onclick="sendAction('buy')">📦 Купить товар</button>
        <button onclick="sendAction('sell')">💵 Продать товар</button>
        <button onclick="sendAction('work')">👷 Работа</button>
        <button onclick="sendAction('upgrade')">🚀 Улучшить ($500)</button>
        <button class="full-width" onclick="sendAction('stats')">📊 Статистика и Событие дня</button>
    </div>

    <h2>🏆 Рейтинги игроков</h2>
    <div class="btn-grid">
        <button onclick="sendAction('top_players')">🏆 Топ-10 игроков</button>
        <button onclick="sendAction('all_players')">📋 Все игроки</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const user = tg.initDataUnsafe?.user;
        
        document.getElementById('user-card').innerHTML = `
            👤 Игрок: <b>${user ? (user.first_name || user.username) : 'Гость'}</b><br>
            📱 Telegram ID: ${user ? user.id : 'Неизвестно'}<br>
            <i>Нажимайте кнопки ниже, результаты пришлет бот в чат.</i>
        `;

        function sendAction(action) {
            tg.sendData(action);
        }
    </script>
</body>
</html>
