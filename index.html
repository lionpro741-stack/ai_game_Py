<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Бизнес Симулятор Mini App</title>
    <!-- Подключаем скрипт Telegram Web App -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: var(--tg-theme-bg-color, #ffffff);
            --text-color: var(--tg-theme-text-color, #000000);
            --hint-color: var(--tg-theme-hint-color, #999999);
            --button-color: var(--tg-theme-button-color, #2481cc);
            --button-text-color: var(--tg-theme-button-text-color, #ffffff);
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h2 { margin-bottom: 8px; }
        .card {
            background: rgba(128, 128, 128, 0.1);
            border-radius: 12px;
            padding: 12px;
            width: 100%;
            max-width: 400px;
            margin-bottom: 16px;
            box-sizing: border-box;
        }
        .btn-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            width: 100%;
            max-width: 400px;
        }
        button {
            background-color: var(--button-color);
            color: var(--button-text-color);
            border: none;
            border-radius: 8px;
            padding: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        button:active { opacity: 0.8; }
        .full-width { grid-column: span 2; }
    </style>
</head>
<body>

    <h2>📊 Статистика бизнеса</h2>
    <div class="card" id="stats-card">
        Загрузка данных...
    </div>

    <h2>🏢 Выбор бизнеса</h2>
    <div class="btn-grid">
        <button onclick="selectBusiness('Кафе')">☕ Кафе</button>
        <button onclick="selectBusiness('Магазин одежды')">👗 Одежда</button>
        <button onclick="selectBusiness('Интернет магазин')">🎧 Интернет-магазин</button>
        <button onclick="selectBusiness('Автомойка')">🚗 Автомойка</button>
    </div>

    <h2>⚙️ Действия</h2>
    <div class="btn-grid" style="margin-top: 10px;">
        <button onclick="sendAction('buy')">📦 Купить товар</button>
        <button onclick="sendAction('sell')">💵 Продать товар</button>
        <button onclick="sendAction('work')">👷 Работа</button>
        <button onclick="sendAction('upgrade')">🚀 Улучшить ($500)</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand(); // Растянуть на весь экран

        // Получаем информацию о пользователе из Telegram
        const user = tg.initDataUnsafe?.user;
        
        // Отрендерим базовую плашку статистики в Mini App
        document.getElementById('stats-card').innerHTML = `
            👤 Игрок: ${user ? (user.first_name || user.username) : 'Гость'}<br>
            📱 Telegram ID: ${user ? user.id : 'Неизвестно'}<br>
            <i>Выберите действие ниже, бот пришлет отчет в чат!</i>
        `;

        function selectBusiness(bizName) {
            tg.sendData("select:" + bizName);
        }

        function sendAction(action) {
            tg.sendData(action);
        }
    </script>
</body>
</html>
